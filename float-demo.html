<title>Fufuka 漂浮頭像・示範頁</title>
<style>
  body { margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f8fb; color: #22303c; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 120px; }
  h1 { font-size: 22px; }
  p { line-height: 1.7; color: #47606f; }
  .card { background: #fff; border: 1px solid #dde7ee; border-radius: 14px; padding: 16px; margin-top: 14px; }
  /* ---- floating head ---- */
  #fuBubble { position: fixed; right: 10px; bottom: 12px; width: 78px; cursor: pointer; z-index: 9999; touch-action: none;
  }
  #fuBubble img { width: 100%; display: block; filter: drop-shadow(0 5px 8px rgba(30,60,90,.35)); }

  #fuPanel { position: fixed; right: 16px; bottom: 96px; width: 264px; max-width: calc(100vw - 32px);
    background: #fff; border: 1px solid #dde7ee; border-radius: 16px; box-shadow: 0 12px 30px rgba(30,60,90,.22);
    padding: 14px; z-index: 9999; display: none; }
  #fuPanel.open { display: block; }
  #fuPanel h3 { margin: 0 0 4px; font-size: 15px; }
  #fuPanel .w { margin: 0 0 10px; font-size: 12.5px; color: #5b7183; }
  #fuPanel a, #fuPanel button { display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px;
    padding: 9px 10px; margin-top: 6px; border-radius: 9px; border: 1px solid #cfdde8; background: #fff; color: #22303c;
    text-decoration: none; box-sizing: border-box; cursor: pointer; }
  #fuPanel a:hover, #fuPanel button:hover { background: #eef6fc; }
</style>
</head>
<body>
<main>
  <h1>這是「漂浮在程式內」的示範頁</h1>
  <p>右下角那顆頭就是我。它浮在這個頁面裡面，你可以按住它拖來拖去，點一下會打開小面板。</p>
  <div class="card">
    <b>跟「最上層」差在哪？</b>
    <p style="margin:6px 0 0">這一顆只活在這個頁面裡 — 你離開這個頁面、切去別的 App，它就不在了。最上層那種是另外一支 Android App，裝了之後不管你開什麼，它都在。</p>
  </div>
  <div class="card">
    <b>試試看</b>
    <p style="margin:6px 0 0">1. 點一下頭像，看面板打開。<br>2. 按住頭像拖到別的位置，放開。<br>3. 把頁面往下捲，頭像會一直跟著。</p>
  </div>
  <p style="margin-top:18px">面板裡的天氣是真的：它跟外掛用同一份資料，台北今天的天氣。頭像的背景也會跟著天氣換。</p>
</main>

<div id="fuPanel">
  <h3>嗨，我是 Fufuka</h3>
  <p class="w" id="fuWeather">天氣讀取中…</p>
  <a href="https://muse.ai">跟 Fufuka 聊天</a>
  <button id="fuClose">先收起來</button>
</div>

<script>
(function () {
  var bubble = document.getElementById('fuBubble');
  var panel = document.getElementById('fuPanel');
  function setAvatar(variant) { /* frameless body: single look, weather lives in the panel text */ }
  setAvatar('cloudy');
  /* weather (same source as the extension: Open-Meteo, Taipei) */
  var LABEL = {0:'晴天',1:'大致晴朗',2:'多雲',3:'陰天',45:'有霧',48:'有霧',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'陣雨',81:'陣雨',82:'大陣雨',95:'雷雨',96:'雷雨',99:'雷雨'};
  function variantFor(code, isDay) {
    if (code === 0) return 'sunny';
    if (code === 1 || code === 2) return isDay ? 'sunny' : 'cloudy';
    if (code === 3) return 'cloudy';
    if (code === 45 || code === 48) return 'fog';
    if ([71,73,75,77,85,86].indexOf(code) >= 0) return 'snow';
    if ([95,96,99].indexOf(code) >= 0) return 'thunder';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
    return 'cloudy';
  }
  fetch('https://api.open-meteo.com/v1/forecast?latitude=25.033&longitude=121.5654&current=temperature_2m,weather_code,is_day&timezone=Asia%2FTaipei')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var c = j.current || {};
      document.getElementById('fuWeather').textContent = '今天台北：' + (LABEL[c.weather_code] || '多雲') + ' ' + Math.round(c.temperature_2m) + '°C';
      setAvatar(variantFor(c.weather_code, c.is_day === 1));
    })
    .catch(function () { document.getElementById('fuWeather').textContent = '天氣暫時讀不到'; });

  /* drag + tap */
  var sx = 0, sy = 0, ox = 0, oy = 0, moved = false, dragging = false;
  function pos() { var r = bubble.getBoundingClientRect(); return { x: r.left, y: r.top }; }
  bubble.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false;
    var p = pos(); sx = e.clientX; sy = e.clientY; ox = p.x; oy = p.y;
    bubble.setPointerCapture(e.pointerId);
  });
  bubble.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    if (moved) {
      bubble.style.left = Math.max(4, Math.min(window.innerWidth - 72, ox + dx)) + 'px';
      bubble.style.top = Math.max(4, Math.min(window.innerHeight - 72, oy + dy)) + 'px';
      bubble.style.right = 'auto'; bubble.style.bottom = 'auto';
    }
  });
  bubble.addEventListener('pointerup', function () {
    dragging = false;
    if (!moved) panel.classList.toggle('open');
  });
  document.getElementById('fuClose').addEventListener('click', function () { panel.classList.remove('open'); });
})();
</script>
